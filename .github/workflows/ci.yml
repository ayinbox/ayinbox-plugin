name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ayinbox/ayinbox-skills
          ref: main
          path: .upstream/ayinbox-skills
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifests parse and agree
        run: node scripts/validate-manifests.mjs
      - name: Skills match ayinbox/ayinbox-skills
        run: node scripts/sync-skills.mjs --check .upstream/ayinbox-skills
      - name: Lint every SKILL.md
        run: node scripts/lint-skills.mjs
